    <title>Monster Tactics: Infinite Legacy v5.0</title>

    <style>
        :root {
            --app-height: 100vh;
        }
            --bg-dark: #0f0f1a;
            --bg-panel: #1a1a24;
            --bg-card: #22222d;
            --accent-gold: #ffcc00;
            --accent-red: #ff4d4d;
            --accent-blue: #00aaff;
            --accent-green: #1db954;
            --accent-purple: #9d4edd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body {
            height: 100%;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #05050a 100%);
            color: #fff; font-family: 'Kanit', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: var(--app-height); min-height: var(--app-height); overflow: hidden;
            position: fixed; inset: 0; width: 100%;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #game-container {
            position: relative; width: 100%; max-width: 450px; height: 100%; max-height: 850px;
            background: linear-gradient(180deg, #1e1e2a 0%, #15151c 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05); 
            display: flex; flex-direction: column; border-radius: 12px; overflow: hidden;
        }
        #top-ui {
            height: 65px; background: rgba(10, 10, 15, 0.72);
            background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-between;
            align-items: center; padding: 0 15px; 
            font-weight: 600; font-size: 14px; 
            border-bottom: 3px solid #000;
            box-shadow: 0 2px 0 rgba(255,255,255,0.06);
            z-index: 10;
        }
        .stats-left { display: flex; flex-direction: column; gap: 4px; text-shadow: 0 2px 0 #000; }
        #gold-text { color: var(--accent-gold); display: flex; align-items: center; gap: 5px; letter-spacing: 0.5px; }
        #pity-text { color: #d9aaff; font-size: 11px; font-weight: 400; }
        #wave-text { 
            color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-red), #ff8855);
            padding: 6px 14px; border: 2px solid #000;
            clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.35), inset 2px 2px 0 rgba(255,255,255,0.25), 0 4px 10px rgba(255,77,77,0.3);
        }
        #canvas-wrapper { 
            flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; 
            background: radial-gradient(circle at center, #1a1a24 0%, #0a0a0e 100%);
            overflow: hidden;
        }
        canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
        #bottom-ui { 
            background: rgba(10, 10, 15, 0.85);
            background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
            backdrop-filter: blur(10px);
            padding: 12px; border-top: 3px solid #000; 
            display: flex; flex-direction: column; gap: 8px;
        }
        #log-box {
            background: #0a0a0a; color: #ffcc00; padding: 8px; 
            font-size: 12px; height: 45px; overflow-y: hidden; text-align: center;
            display: flex; align-items: center; justify-content: center; font-weight: 400; line-height: 1.4;
            border: 2px solid #000;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.5), inset -2px -2px 0 rgba(255,204,0,0.08), 0 0 0 1px rgba(255,204,0,0.15);
        }
        #sell-zone {
            background: rgba(74, 34, 34, 0.4); border: 2px dashed #ff4d4d; color: #ff8888; text-align: center;
            padding: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        #sell-zone:active { background: rgba(255, 77, 77, 0.4); }
        #controls { display: flex; gap: 8px; }
        button { 
            flex: 1; padding: 14px 0; border: 2px solid #000; 
            font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.1s;
            font-family: 'Kanit', sans-serif;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.25), 0 4px 0 rgba(0,0,0,0.5);
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        button:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 3px 3px 0 rgba(0,0,0,0.35), inset -3px -3px 0 rgba(255,255,255,0.1); }
        #btn-menu { background: linear-gradient(135deg, #444, #333); color: #fff; flex: 0.3; }
        #btn-buy { background: linear-gradient(135deg, var(--accent-green), #14803a); color: #fff; }
        #btn-start { background: linear-gradient(135deg, var(--accent-red), #b53030); color: #fff; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95); backdrop-filter: blur(15px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; padding: 20px;
        }
        .hidden { display: none !important; }
        .menu-title { 
            font-size: 36px; color: #fff; margin-bottom: 10px; text-align: center; font-weight: 800; 
            background: linear-gradient(90deg, #ffcc00, #ff33aa, #00aaff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .menu-sub { font-size: 14px; color: #aaa; margin-bottom: 30px; letter-spacing: 4px; }
        .menu-btn {
            width: 85%; padding: 15px; margin: 8px 0; font-size: 16px;
            background: rgba(255,255,255,0.05); color: #fff; border: 2px solid rgba(255,255,255,0.15); font-weight: 600;
            backdrop-filter: blur(5px); transition: 0.15s;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.08);
        }
        .menu-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.35); }
        .menu-btn:active { transform: translateY(2px); }
        #btn-continue { background: linear-gradient(135deg, var(--accent-blue), #0056b3); border-color: #000; }
        #guide-content {
            width: 100%; max-height: 70%; overflow-y: auto; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; margin-bottom: 15px;
        }
        #guide-content::-webkit-scrollbar { width: 4px; }
        #guide-content::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .recipe-row { 
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 1px solid rgba(255,255,255,0.05); padding: 10px 5px; font-size: 13px; 
        }
        .recipe-unknown { color: #555; font-style: italic; }
        .highlight { color: #33ffcc; font-weight: 600; text-shadow: 0 0 5px rgba(51,255,204,0.3); }
        .tier-badge { font-size: 10px; background: #333; padding: 2px 5px; border-radius: 4px; margin-left: 5px; }

</head>

<div id="game-container">

        <div class="menu-title">MONSTER TACTICS</div>

    </div>

    </div>

        <div id="sell-zone">🗑️ ลากมอนสเตอร์มาทิ้งที่นี่เพื่อขาย (ดาว x 4 ทอง)</div>

            <button id="btn-start" onclick="startCombat()">⚔️ เริ่มต่อสู้</button>
        </div>
    </div>
</div>

// 4. Pixel Art — Unique Silhouette Sprites
// ==========================================
// Legend: 0=Transparent 1=Outline 2=Body 3=Highlight(+55%) 4=Shadow(-35%) 5=EyeWhite 6=Pupil 7=Mouth/Red 8=Fang/Claw(cream) 9=Glint A=Gold B=LightBody(+30%) C=ShellGreen D=DarkStripe E=Glow(yellow)

function shadeColor(color, percent) {
    let R=parseInt(color.substring(1,3),16),G=parseInt(color.substring(3,5),16),B=parseInt(color.substring(5,7),16);
    R=parseInt(R*(100+percent)/100); G=parseInt(G*(100+percent)/100); B=parseInt(B*(100+percent)/100);
    R=(R<255)?R:255; G=(G<255)?G:255; B=(B<255)?B:255;
    R=Math.max(0,R); G=Math.max(0,G); B=Math.max(0,B);
    return "#"+((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16))+((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16))+((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
}

// ==========================================
// Monster Image Cache System
// ==========================================
// Images should be placed in an "images/" folder (same directory as this HTML file)
// with filenames matching the monster id, e.g.: images/slime.png, images/wolf.png
//
// Fallback: if an image fails to load or is missing, a colored circle is drawn instead.

const MONSTER_IMG_CACHE = {};

function getMonsterImage(id) {
    if (MONSTER_IMG_CACHE[id]) return MONSTER_IMG_CACHE[id];
    const entry = { img: null, loaded: false, failed: false };
    MONSTER_IMG_CACHE[id] = entry;
    const img = new Image();
    img.onload = () => { entry.img = img; entry.loaded = true; };
    img.onerror = () => { entry.failed = true; };
    img.src = `images/${id}.png`;
    return entry;
}

function drawMonsterImage(id, color, size=48) {
    const half = size / 2;
    const entry = getMonsterImage(id);
    if (entry.loaded && entry.img) {
        ctx.drawImage(entry.img, -half, -half, size, size);
    } else {
        // Fallback: draw a colored circle while image loads (or if missing)
        ctx.beginPath();
        ctx.arc(0, 0, half * 0.8, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}


// ==========================================
// 5. Combat Unit Object
// ==========================================
class Unit {
    constructor(id, row, col, isEnemy=false, star=1) {
        const t = MONSTERS[id] || MONSTERS['slime'];
        this.id=id; this.name=t.name; this.color=t.color; this.star=star; this.tier=t.tier;
        let multi = 1 + (0.5 * (this.star - 1));
        this.maxHp = Math.floor(t.hp * multi); this.hp = this.maxHp; this.atk = Math.floor(t.atk * multi);
        this.row=row; this.col=col; this.isEnemy=isEnemy;
        let pos=getCellXY(row,col); this.x=pos.x; this.y=pos.y;
        this.state='IDLE'; this.target=null; this.stateTimer=0; 
        this.isDragging=false; this.animFrame=Math.random()*10;
        this.offsetX=0; this.offsetY=0;
    }
    update() {
        if (this.state==='DEAD') return;
        this.animFrame += 0.1;
        if (gameState.phase==='COMBAT' && this.row<6) this.updateCombatAI();
        else { this.offsetX=0; this.offsetY=Math.sin(this.animFrame)*3; }
    }
    updateCombatAI() {
        if (!this.target || this.target.state==='DEAD') { this.target=this.findClosestTarget(); this.state='IDLE'; }
        if (!this.target) return;
        let dx=this.target.x-this.x, dy=this.target.y-this.y, dist=Math.sqrt(dx*dx+dy*dy);
        if (dist>CELL_SIZE) {
            this.state='MOVE'; this.x+=(dx/dist)*1.5; this.y+=(dy/dist)*1.5;
            this.offsetY=Math.sin(this.animFrame*2)*4;
        } else {
            this.state='ATTACK'; this.stateTimer++;
            if (this.stateTimer>=35) { this.performAttack(); this.stateTimer=0; }
        }
    }
    findClosestTarget() {
        let targets=this.isEnemy?gameState.playerUnits:gameState.enemyUnits;
        let closest=null, minDist=99999;
        for (let t of targets) {
            if (t.state==='DEAD'||(this.isEnemy&&t.row>=6)) continue;
            let dist=Math.sqrt(Math.pow(t.x-this.x,2)+Math.pow(t.y-this.y,2));
            if (dist<minDist) { minDist=dist; closest=t; }
        }
        return closest;
    }
    performAttack() {
        if (!this.target||this.target.state==='DEAD') return;
        this.offsetX=(this.target.x-this.x)*0.3; this.offsetY=(this.target.y-this.y)*0.3;
        this.target.hp -= this.atk;
        if (this.target.hp<=0) { this.target.hp=0; this.target.state='DEAD'; }
        gameState.effects.push({x:this.target.x, y:this.target.y, text:`-${this.atk}`, color:'#ffcc00', duration:30});
        setTimeout(()=>{ this.offsetX=0; this.offsetY=0; }, 100);
    }
    draw() {
        if (this.state==='DEAD') return;
        let renderX=this.isDragging?mouseX:this.x+this.offsetX;
        let renderY=this.isDragging?mouseY:this.y+this.offsetY;
        ctx.save();
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(renderX, renderY+20, 22, 8, 0, 0, Math.PI*2); ctx.fill();
        if (this.tier>=3) {
            let glowR=22+this.tier*4;
            let grad=ctx.createRadialGradient(renderX,renderY,2,renderX,renderY,glowR);
            grad.addColorStop(0, this.color+'66');
            grad.addColorStop(1, this.color+'00');
            ctx.fillStyle=grad;
            ctx.beginPath(); ctx.arc(renderX,renderY,glowR,0,Math.PI*2); ctx.fill();
        }
        ctx.save(); ctx.translate(renderX, renderY);
        if (this.isEnemy) ctx.scale(-1,1);
        drawMonsterImage(this.id, this.color);
        ctx.restore();
        let hpRatio=this.hp/this.maxHp;
        ctx.fillStyle='#222'; ctx.fillRect(renderX-18,renderY-28,36,5);
        ctx.fillStyle=this.isEnemy?'#ff3333':'#33ff33'; ctx.fillRect(renderX-18,renderY-28,36*hpRatio,5);
        ctx.fillStyle='#fff'; ctx.font='bold 11px Kanit'; ctx.textAlign='center';
        ctx.shadowColor='#000'; ctx.shadowBlur=2; ctx.lineWidth=3;
        ctx.strokeStyle='#000';
        ctx.strokeText(this.name,renderX,renderY-34);
        ctx.fillText(this.name,renderX,renderY-34);
        ctx.fillStyle='#ffcc00'; ctx.font='10px Arial'; 
        ctx.fillText('★'.repeat(this.star),renderX,renderY-44);
        ctx.restore();
    }
}

// ==========================================
// 6. Gacha System
// ==========================================
function openGacha() {
    if (gameState.gachaBoxes<=0) return;
    gameState.gachaBoxes--; gameState.pityCounter++;
    let allMonsters=Object.keys(MONSTERS);
    let rolledId=null;
    let lockedPool=allMonsters.filter(k=>!persistentRecipes.includes(k));
    if (gameState.pityCounter>=10 && lockedPool.length>0) {
        rolledId=lockedPool[Math.floor(Math.random()*lockedPool.length)];
        gameState.pityCounter=0;
    } else {
        let rng=Math.random()*100, targetTier=1;
        if (rng<40) targetTier=1;
        else if (rng<70) targetTier=2;
        else if (rng<87) targetTier=3;
        else if (rng<96) targetTier=4;
        else targetTier=5;
        let tierPool=allMonsters.filter(k=>MONSTERS[k].tier===targetTier);
        if (tierPool.length===0) tierPool=allMonsters;
        rolledId=tierPool[Math.floor(Math.random()*tierPool.length)];
    }
    let isNew=!persistentRecipes.includes(rolledId);
    if (isNew) {
        persistentRecipes.push(rolledId);
        savePersistentRecipes();
        gameState.unlockedSpecies=[...persistentRecipes];
        gameState.pityCounter=0;
    }
    let spot=getOpenSpot();
    if (spot) {
        let star=MONSTERS[rolledId].tier;
        let u=new Unit(rolledId, spot.r, spot.c, false, star);
        gameState.playerUnits.push(u);
        if (isNew) {
            logMsg(`🎉 ปลดล็อกสูตรใหม่ถาวร: [${u.name}] ${star}★`);
            gameState.effects.push({x:u.x, y:u.y, text:`NEW!`, color:'#ff33aa', duration:70});
        } else {
            logMsg(`🎁 ได้รับ: [${u.name}] ${star}★`);
            gameState.effects.push({x:u.x, y:u.y, text:`DUP`, color:'#aaa', duration:50});
        }
    } else {
        logMsg(`ช่องเต็ม! คืน +20 ทอง`); gameState.gold+=20;
    }
    updateUI(); saveGame();
}

// ==========================================
// 7. Game Loop & Flow
// ==========================================
function spawnWave() {
    gameState.enemyUnits=[];
    let w=gameState.wave;
    let pool=Object.keys(MONSTERS).filter(k=>MONSTERS[k].tier<=1+Math.floor(w/3));
    let count=Math.min(3+Math.floor(w/3),8);
    let spots=[];
    for (let r=0;r<=2;r++) for (let c=0;c<5;c++) if (GRID_LAYOUT[r][c]===1) spots.push({r,c});
    spots.sort(()=>Math.random()-0.5);
    for (let i=0;i<count&&i<spots.length;i++) {
        let id=pool[Math.floor(Math.random()*pool.length)];
        let eStar=1+Math.floor(w/5); if(eStar>5) eStar=5;
        gameState.enemyUnits.push(new Unit(id,spots[i].r,spots[i].c,true,eStar));
    }
}

function buyRandomUnit() {
    if (gameState.phase!=='PREPARE'||gameState.gold<5) return;
    let spot=getOpenSpot(); if(!spot){logMsg("❌ คลังเต็ม!");return;}
    gameState.gold-=5;
    let pool=gameState.unlockedSpecies.filter(id=>MONSTERS[id].tier===1);
    let id=pool[Math.floor(Math.random()*pool.length)];
    gameState.playerUnits.push(new Unit(id,spot.r,spot.c,false,1));
    logMsg(`🛒 ซื้อสำเร็จ: ${MONSTERS[id].name} 1★`);
    updateUI(); saveGame();
}

function getOpenSpot() {
    for (let r=6;r<=7;r++) for (let c=0;c<5;c++) if(!getUnitAtGrid(r,c)) return{r,c};
    return null;
}
function getUnitAtGrid(r,c) { return gameState.playerUnits.find(u=>u.row===r&&u.col===c&&u.state!=='DEAD'); }

function checkMerge(uA, uB) {
    if (uA.id===uB.id) { logMsg(`ℹ️ สายพันธุ์เดียวกัน`); return false; }
    if (uA.star!==uB.star) { logMsg(`⚠️ ระดับดาวไม่เท่ากัน!`); return false; }
    for (let r of RECIPES) {
        if ((r.in[0]===uA.id&&r.in[1]===uB.id)||(r.in[1]===uA.id&&r.in[0]===uB.id)) {
            if (!gameState.unlockedSpecies.includes(r.out)) {
                logMsg(`⚠️ ต้องปลดล็อก [${MONSTERS[r.out].name}] จากกล่องก่อน`); return false;
            }
            let newStar=Math.min(5,uA.star+1);
            gameState.playerUnits=gameState.playerUnits.filter(u=>u!==uA&&u!==uB);
            let f=new Unit(r.out,uB.row,uB.col,false,newStar);
            gameState.playerUnits.push(f);
            logMsg(`⚡ ฟิวชั่น!! ➔ "${f.name} ${newStar}★"`);
            gameState.effects.push({x:f.x,y:f.y,text:`FUSION!`,color:'#33ffcc',duration:60});
            return true;
        }
    }
    logMsg(`❌ ไม่มีสูตรผสมสำหรับคู่นี้`);
    return false;
}

function startCombat() {
    if (gameState.phase==='GAMEOVER') return;
    let active=gameState.playerUnits.filter(u=>u.row<6);
    if (active.length===0) { logMsg("⚠️ วางกองทัพในโซนสีน้ำเงินก่อน!"); return; }
    gameState.phase='COMBAT'; updateUI(); logMsg("⚔️ ศึกเริ่มแล้ว!");
}

function getCanvasCoords(e) {
    const rect=canvas.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return{x:((cx-rect.left)/rect.width)*GAME_WIDTH, y:((cy-rect.top)/rect.height)*GAME_HEIGHT};
}
function handleStart(e) {
    if (gameState.phase!=='PREPARE') return;
    const coords=getCanvasCoords(e); mouseX=coords.x; mouseY=coords.y;
    if (gameState.gachaBoxes>0&&mouseX>GAME_WIDTH-60&&mouseY>GAME_HEIGHT-60){openGacha();return;}
    for (let u of gameState.playerUnits) {
        if (Math.sqrt(Math.pow(u.x-mouseX,2)+Math.pow(u.y-mouseY,2))<28){dragUnit=u;u.isDragging=true;break;}
    }
}
function handleMove(e) { if(dragUnit){e.preventDefault();let c=getCanvasCoords(e);mouseX=c.x;mouseY=c.y;} }
function handleEnd(e) {
    if (!dragUnit) return;
    const sellZone=document.getElementById('sell-zone').getBoundingClientRect();
    const cy=e.touches?(e.changedTouches?e.changedTouches[0].clientY:0):e.clientY;
    if (cy>=sellZone.top&&cy<=sellZone.bottom) {
        let price=dragUnit.star*4; gameState.gold+=price;
        gameState.playerUnits=gameState.playerUnits.filter(u=>u!==dragUnit);
        logMsg(`💰 ขาย: ${dragUnit.name} +${price}G`); dragUnit=null; updateUI(); saveGame(); return;
    }
    let targetCell=null;
    for (let r=0;r<=7;r++) for (let c=0;c<5;c++) {
        if (GRID_LAYOUT[r][c]<=1) continue;
        let pos=getCellXY(r,c);
        if (Math.abs(mouseX-pos.x)<CELL_SIZE/2&&Math.abs(mouseY-pos.y)<CELL_SIZE/2){targetCell={r,c};break;}
    }
    if (targetCell) {
        let exist=getUnitAtGrid(targetCell.r,targetCell.c);
        if (exist&&exist!==dragUnit) {
            if (!checkMerge(dragUnit,exist)) {
                exist.row=dragUnit.row; exist.col=dragUnit.col;
                let px=getCellXY(exist.row,exist.col); exist.x=px.x; exist.y=px.y;
                dragUnit.row=targetCell.r; dragUnit.col=targetCell.c;
            }
        } else { dragUnit.row=targetCell.r; dragUnit.col=targetCell.c; }
    }
    if (dragUnit){let pf=getCellXY(dragUnit.row,dragUnit.col);dragUnit.x=pf.x;dragUnit.y=pf.y;dragUnit.isDragging=false;dragUnit=null;}
    saveGame();
}
canvas.addEventListener('mousedown',handleStart); canvas.addEventListener('mousemove',handleMove); canvas.addEventListener('mouseup',handleEnd);
canvas.addEventListener('touchstart',handleStart,{passive:false}); canvas.addEventListener('touchmove',handleMove,{passive:false}); canvas.addEventListener('touchend',handleEnd);

function update() {
    gameState.playerUnits.forEach(u=>u.update()); gameState.enemyUnits.forEach(u=>u.update());
    for (let i=gameState.effects.length-1;i>=0;i--) {
        gameState.effects[i].y-=0.5; gameState.effects[i].duration--;
        if (gameState.effects[i].duration<=0) gameState.effects.splice(i,1);
    }
    if (gameState.phase==='COMBAT') {
        let pAlive=gameState.playerUnits.filter(u=>u.state!=='DEAD'&&u.row<6).length;
        let eAlive=gameState.enemyUnits.filter(u=>u.state!=='DEAD').length;
        if (eAlive===0) {
            gameState.gold+=8+Math.floor(gameState.wave/2); gameState.wave++;
            if (gameState.wave%3===0){gameState.gachaBoxes++;logMsg("🎁 บอสเวฟ! รับกล่องสุ่ม +1!");}
            else logMsg(`⚔️ ชนะ! เวฟ ${gameState.wave}`);
            gameState.phase='PREPARE';
            gameState.playerUnits.forEach(u=>{u.state='IDLE';u.hp=u.maxHp;u.target=null;let p=getCellXY(u.row,u.col);u.x=p.x;u.y=p.y;});
            spawnWave(); updateUI(); saveGame();
        } else if (pAlive===0) {
            gameState.phase='GAMEOVER'; clearSave(); logMsg("💀 พ่ายแพ้! เวฟ "+gameState.wave); updateUI();
        }
    }
}

function draw() {
    ctx.clearRect(0,0,GAME_WIDTH,GAME_HEIGHT);
    for (let r=0;r<=7;r++) for (let c=0;c<5;c++) {
        let type=GRID_LAYOUT[r][c]; if(type===0) continue;
        let pos=getCellXY(r,c); let sx=pos.x-CELL_SIZE/2, sy=pos.y-CELL_SIZE/2;
        ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.strokeRect(sx,sy,CELL_SIZE,CELL_SIZE);
        if (type===1){ctx.fillStyle='rgba(255,50,50,0.05)';ctx.fillRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4);}
        else if (type===2){ctx.fillStyle='rgba(50,100,255,0.05)';ctx.fillRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4);}
        else if (type===3){
            ctx.fillStyle='rgba(150,150,150,0.08)'; ctx.fillRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4);
            ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.setLineDash([4,4]); ctx.strokeRect(sx+4,sy+4,CELL_SIZE-8,CELL_SIZE-8); ctx.setLineDash([]);
        }
    }
    gameState.playerUnits.forEach(u=>u.draw()); gameState.enemyUnits.forEach(u=>u.draw());
    if (gameState.gachaBoxes>0&&gameState.phase==='PREPARE') {
        let gx=GAME_WIDTH-35, gy=GAME_HEIGHT-35+Math.sin(Date.now()/150)*3;
        ctx.shadowColor='#ff33aa'; ctx.shadowBlur=15;
        ctx.fillStyle='#ff33aa'; ctx.fillRect(gx-18,gy-18,36,36);
        ctx.shadowBlur=0;
        ctx.fillStyle='#fff'; ctx.font='20px Arial'; ctx.textAlign='center'; ctx.fillText('🎁',gx,gy+7);
        ctx.font='bold 10px Kanit'; ctx.fillStyle='#ff33aa'; ctx.fillText(`เปิด (${gameState.gachaBoxes})`,gx,gy-22);
    }
    gameState.effects.forEach(f=>{ctx.fillStyle=f.color;ctx.font='bold 12px Kanit';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.fillText(f.text,f.x,f.y);ctx.shadowBlur=0;});
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

// ==========================================
// 9. UI & Lifecycle
// ==========================================
function updateUI() {
    document.getElementById('gold-text').innerText=`🪙 ทอง: ${gameState.gold}`;
    document.getElementById('pity-text').innerText=`🌟 การันตีสูตรใหม่ในอีก: ${10-gameState.pityCounter} กล่อง`;
    document.getElementById('wave-text').innerText=`WAVE ${gameState.wave}`;
    let btnStart=document.getElementById('btn-start');
    if (gameState.phase==='PREPARE') {
        document.getElementById('btn-buy').disabled=gameState.gold<5;
        btnStart.innerText='⚔️ เริ่มต่อสู้'; btnStart.style.background='linear-gradient(135deg,#ff4d4d,#b53030)'; btnStart.onclick=startCombat;
    } else if (gameState.phase==='GAMEOVER') {
        btnStart.innerText='🔄 เล่นใหม่'; btnStart.style.background='linear-gradient(135deg,#00aaff,#0056b3)'; btnStart.onclick=startGame;
    } else {
        document.getElementById('btn-buy').disabled=true;
        btnStart.innerText='⚡ กำลังรบ'; btnStart.style.background='#555'; btnStart.onclick=null;
    }
}
function logMsg(msg) { document.getElementById('log-box').innerText=msg; }
function showMenu() { document.getElementById('main-menu').classList.remove('hidden'); }

function openGuide() {
    let html='';
    let sortedRecipes=[...RECIPES].sort((a,b)=>MONSTERS[a.out].tier-MONSTERS[b.out].tier);
    // deduplicate by output
    let seen=new Set();
    sortedRecipes=sortedRecipes.filter(r=>{if(seen.has(r.out))return false;seen.add(r.out);return true;});
    sortedRecipes.forEach(r=>{
        if(!MONSTERS[r.in[0]]||!MONSTERS[r.in[1]]||!MONSTERS[r.out]) return;
        let i1=MONSTERS[r.in[0]].name, i2=MONSTERS[r.in[1]].name;
        let t1=MONSTERS[r.in[0]].tier, t2=MONSTERS[r.in[1]].tier;
        if (persistentRecipes.includes(r.out)) {
            html+=`<div class="recipe-row"><span>${i1} <span class="tier-badge">${t1}★</span> + ${i2} <span class="tier-badge">${t2}★</span></span> <span class="highlight">➔ ${MONSTERS[r.out].name} <span class="tier-badge" style="background:#33ffcc33">${MONSTERS[r.out].tier}★</span></span></div>`;
        } else {
            html+=`<div class="recipe-row recipe-unknown"><span>${i1} + ${i2}</span> <span>➔ 🔒 ???</span></div>`;
        }
    });
    document.getElementById('guide-content').innerHTML=html;
    document.getElementById('fusion-guide').classList.remove('hidden');
}
function closeGuide() { document.getElementById('fusion-guide').classList.add('hidden'); }

function startGame() {
    clearSave(); dragUnit=null; mouseX=0; mouseY=0; gameState.effects=[];
    document.getElementById('main-menu').classList.add('hidden');
    gameState={gold:15,wave:1,phase:'PREPARE',pityCounter:0,gachaBoxes:2,playerUnits:[],enemyUnits:[],effects:[],unlockedSpecies:[...persistentRecipes]};
    gameState.playerUnits.push(new Unit('cat',6,1,false,1));
    gameState.playerUnits.push(new Unit('wolf',6,3,false,1));
    spawnWave(); updateUI(); saveGame();
    logMsg("🔄 เริ่มการเดินทางใหม่! สูตรผสมสืบทอดเรียบร้อย");
}
function continueGame() {
    const saved=localStorage.getItem('monsterTacticsSave_v5'); if(!saved) return;
    dragUnit=null; let data=JSON.parse(saved);
    gameState={gold:data.gold,wave:data.wave,phase:'PREPARE',pityCounter:data.pityCounter||0,gachaBoxes:data.gachaBoxes||0,unlockedSpecies:[...persistentRecipes],playerUnits:[],enemyUnits:[],effects:[]};
    data.playerUnits.forEach(u=>{let unit=new Unit(u.id,u.row,u.col,false,u.star);unit.hp=u.hp;gameState.playerUnits.push(unit);});
    document.getElementById('main-menu').classList.add('hidden');
    spawnWave(); updateUI();
}

requestAnimationFrame(gameLoop);
</script>
